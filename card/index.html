:root{--ink:#11100F;--bone:#ECE7DD;--red:#C41E36}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{min-height:100vh;color:var(--bone);font-family:"Inter Tight",system-ui,sans-serif;
background:
 radial-gradient(120% 55% at 50% 12%,rgba(196,30,54,.34),rgba(196,30,54,0) 62%),
 linear-gradient(160deg,rgba(255,110,125,0) 38%,rgba(255,110,125,.07) 46%,rgba(255,110,125,0) 54%),
 radial-gradient(140% 90% at 50% 40%,#17110f 0%,#0c0b0a 100%);
background-attachment:fixed;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
main{max-width:430px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom));text-align:center}
.logo{width:164px;height:164px;margin:6px auto 0;border-radius:50%;padding:7px;position:relative;
 background:conic-gradient(from 210deg,#6d0c1f,#c41e36 12%,#ff8c98 22%,#c41e36 34%,#70101f 50%,#b61a32 64%,#f0566e 76%,#c41e36 88%,#6d0c1f);
 box-shadow:0 0 70px rgba(196,30,54,.55),0 22px 40px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.18)}
.logo img{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 0 3px rgba(0,0,0,.55)}
h1{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:66px;line-height:1;margin-top:26px;letter-spacing:-.01em;text-shadow:0 6px 22px rgba(0,0,0,.7)}
.co{margin-top:12px;font-weight:650;font-size:14.5px;letter-spacing:.2em;text-transform:uppercase;display:inline-block;
 background:linear-gradient(180deg,#f2607a 0%,#d42c46 24%,#c41e36 45%,#8c1226 72%,#e24560 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.rule{width:46px;height:2px;margin:15px auto 14px;background:linear-gradient(90deg,#8c1226,#f2607a,#8c1226)}
.fam{font-family:"DM Mono",monospace;font-size:12.5px;line-height:1.5;opacity:.92}
.btns{display:grid;gap:13px;margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:11px;height:66px;border-radius:33px;text-decoration:none;color:var(--bone);font-weight:650;font-size:19.5px;position:relative;overflow:hidden;transition:transform .12s}
.btn:active{transform:scale(.97)}
.ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.primary{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 46%),linear-gradient(180deg,#e0415b 0%,#c41e36 40%,#8a1226 78%,#b3182f 100%);
 box-shadow:0 14px 30px rgba(196,30,54,.45),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.25);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.primary:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.38) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 4.2s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ghost{background:rgba(236,231,221,.05);box-shadow:inset 0 0 0 1.5px rgba(236,231,221,.55),0 10px 24px rgba(0,0,0,.45)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .btn{height:58px;font-size:16px;gap:8px;font-weight:600}
.panel{margin-top:28px;border-radius:30px;padding:24px 20px 22px;position:relative;
 background:linear-gradient(180deg,#2a2524,#1a1717);box-shadow:0 24px 50px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.panel:before{content:"";position:absolute;inset:0;border-radius:30px;padding:1.5px;background:linear-gradient(160deg,#f2607a,#8c1226 40%,#c41e36 70%,#f2607a);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.qr{width:236px;height:236px;margin:0 auto;border-radius:20px;overflow:hidden;background:var(--bone);box-shadow:0 10px 26px rgba(0,0,0,.55);display:block;padding:0}
.qr svg{width:100%;height:100%;display:block}
.scan{font-family:"Instrument Serif",serif;font-style:italic;font-size:40px;line-height:1;margin-top:18px}
.url{display:inline-block;margin-top:9px;font-family:"DM Mono",monospace;font-size:15px;color:#f2607a;text-decoration:none}
.addr{margin-top:22px;font-family:"DM Mono",monospace;font-size:12.5px;line-height:1.55;opacity:.9}
@media (prefers-reduced-motion:reduce){.primary:after{animation:none;opacity:0}}
