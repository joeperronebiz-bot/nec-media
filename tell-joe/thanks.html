<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100F">
  <meta name="robots" content="noindex, nofollow">
  <title>Thanks · New England Collision</title>
  <style>
    :root { --ink:#11100F; --bone:#ECE7DD; --paper:#F7F3EC; --line:#D5CFC3; --muted:#5A564F; }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    }
    .hero { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .photo {
      flex: none; width: 5.5rem; height: 5.5rem; border-radius: 50%;
      background: #E4DED4; border: 2px solid var(--line);
      overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { font-size: 1.45rem; line-height: 1.2; letter-spacing: -0.02em; }
    p { margin-top: .75rem; font-size: 1.05rem; color: var(--muted); }
    footer { margin-top: 2rem; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="photo"><img src="joe.jpg" width="300" height="300" alt="Joe Perrone"></div>
      <h1>Tell the owner, Joe, directly</h1>
    </header>
    <p>Thanks for telling us. Joe reads every one and we'll make it right.</p>
    <footer>New England Collision · 465 Derby Ave, West Haven CT</footer>
  </main>
</body>
</html>
